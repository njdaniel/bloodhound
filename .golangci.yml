version: "2"

run:
  # Lint the integration-tagged files too. `make test-integration` is a CI job,
  # so the code behind that tag is shipped code — leaving it unlinted would
  # exempt exactly the package that drives containers and raw sockets.
  build-tags:
    - integration

# Linters are chosen to enforce the house rules in CLAUDE.md mechanically,
# rather than to maximize the number of checks running. Anything that fires
# mostly on style preference is left off: a noisy lint job trains people to
# ignore it.
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # "Errors: wrap with fmt.Errorf(\"doing x: %w\", err)" — errorlint catches
    # the other half of that rule: formatting or comparing errors in ways that
    # silently break under wrapping.
    - errorlint
    # "no panics outside main." cmd/ has no panics today; if main ever needs
    # one, it takes a site-local `//nolint:forbidigo // <why>` rather than a
    # blanket exemption for the whole tree.
    - forbidigo
    # Every response body from the Prometheus HTTP API must be closed.
    - bodyclose
    # A context.Context is threaded through every LLM and MCP call
    # (CLAUDE.md); these catch the ways that thread gets dropped.
    - contextcheck
    - noctx
    - unconvert
    - misspell

  settings:
    forbidigo:
      forbid:
        - pattern: ^panic$
          msg: no panics outside main (CLAUDE.md); return a wrapped error
    staticcheck:
      checks:
        - all
        # Initialisms; conflicts with names taken verbatim from the specs.
        - -ST1003
        # "Could remove embedded field from selector." Where a struct embeds a
        # type *and* has a field of that type (intake's webhookPayload), the
        # explicit selector is what makes the two readable side by side.
        - -QF1008

  exclusions:
    presets:
      - comments
      - std-error-handling
    # Anchored path rules (`^cmd/`, `^internal/promtest/`) used to live here.
    # They silently stopped applying whenever golangci-lint reported a finding
    # under a `../`-prefixed path — which the shared, import-path-keyed cache
    # makes routine across sibling git worktrees (issue #25). An exclusion that
    # fails open is worse than no exclusion: the run goes red on code the
    # branch never touched, and it looks like a real finding.
    #
    # Everything that used to be excluded by an anchored path now carries a
    # site-local `//nolint:<linter> // reason` comment instead. Those are
    # resolved from the file itself, so they hold no matter what prefix the
    # reported path has, and each one states why at the line it applies to.
    # New exclusions belong at the site, not here.
    rules:
      # Tests panic freely and assert on concrete errors; the rules above are
      # about production code paths. Deliberately NOT anchored with `^`: the
      # pattern is matched as an unanchored regexp against the reported path,
      # so it matches anywhere in that path — including under a
      # `../other-worktree/` prefix — and cannot fail open.
      - path: _test\.go
        linters:
          - forbidigo
          - errcheck
          - bodyclose
          - noctx

# Report everything. The defaults cap output at 3 issues of a kind and 50 per
# linter, which hides the tail of a problem and makes a partly-fixed run look
# clean while more of the same remain.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
