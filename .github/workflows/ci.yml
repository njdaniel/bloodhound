name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race ./...

  # Separate from `build` so a lint failure and a test failure are
  # distinguishable at a glance, and so lint results arrive even when the
  # tests are red. Linter set and exclusions live in .golangci.yml.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          # Keep in sync with GOLANGCI_VERSION in the Makefile.
          version: v2.12.2

  # Real-Prometheus integration tests. A separate job from `build` because it
  # pulls a container image and takes minutes rather than seconds. It is NOT
  # label-gated: no secrets and no paid API calls are involved — unlike the
  # eval runs that arrive in M4 (CLAUDE.md).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: integration tests
        run: make test-integration

